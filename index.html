/* ---------- MUSIC ---------- */
const music=new Audio(); music.preload='auto';
const discEl=$('#disc'), barEls=[...$('#bars').children];
let musicOn=false, mAnalyser=null, mData=null, fakeBars=0, useFake=false, silent=0;
function loadTrack(i,autoplay){
  S.track=((i%TRACKS.length)+TRACKS.length)%TRACKS.length;
  const t=TRACKS[S.track];
  music.src=sfxSrc(t.f); music.volume=S.set.musVol;
  $('#mtext').innerHTML='<b>'+t.t+'</b><span>'+t.a+'</span>';
  if(autoplay) music.play().catch(()=>{
    alert_('Music files not found','Settings has a loader','#5fe7ff');
  });
}
function setDisc(on){ musicOn=on; discEl.classList.toggle('on',on); $('#mPlay').innerHTML=on?'&#10073;&#10073;':'&#9654;'; }
music.addEventListener('play',()=>{ setDisc(true); hookAnalyser(); });
music.addEventListener('pause',()=>setDisc(false));
music.addEventListener('ended',()=>loadTrack(S.track+1,true));
function hookAnalyser(){
  if(mAnalyser||useFake) return;
  /* a file:// element routed through Web Audio plays silence in Chrome */
  if(!(music.src.startsWith('blob:')||location.protocol.startsWith('http'))){ useFake=true; return; }
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const src=AC.createMediaElementSource(music);
    mAnalyser=AC.createAnalyser(); mAnalyser.fftSize=64;
    src.connect(mAnalyser); mAnalyser.connect(AC.destination);
    mData=new Uint8Array(mAnalyser.frequencyBinCount);
    if(AC.state==='suspended') AC.resume();
  }catch(e){ mAnalyser=null; useFake=true; }
}
function tickBars(){
  if(!musicOn){ barEls.forEach(b=>b.style.height='10%'); return; }
  if(mAnalyser&&!useFake){
    mAnalyser.getByteFrequencyData(mData);
    let sum=0;
    barEls.forEach((b,i)=>{ const v=mData[2+i*3]||0; sum+=v; b.style.height=(9+v/255*91)+'%'; });
    if(sum===0){ if(++silent>50) useFake=true; } else silent=0;
    if(!useFake) return;
  }
  fakeBars+=0.24;
  barEls.forEach((b,i)=>{
    const v=Math.abs(Math.sin(fakeBars*(0.7+i*0.19)+i))*0.72+Math.random()*0.28;
    b.style.height=(10+v*88)+'%';
  });
}

/* Browsers block sound until the page has been clicked, so try straight away
   and, if that is refused, start on the very first click or key press instead. */
let musicArmed=false, audioComplained=false;
function tryStartMusic(){
  if(S.set.muted||!music.paused) return;
  if(!music.src) loadTrack(S.track,false);
  const p=music.play();
  if(p&&p.catch) p.catch(()=>armMusic());
}
function armMusic(){
  if(musicArmed) return;
  musicArmed=true;
  const go=()=>{
    document.removeEventListener('pointerdown',go,true);
    document.removeEventListener('keydown',go,true);
    musicArmed=false;
    tryStartMusic();
  };
  document.addEventListener('pointerdown',go,true);
  document.addEventListener('keydown',go,true);
}
music.addEventListener('error',()=>{
  if(audioComplained||!music.src) return;
  audioComplained=true;
  let where=music.src;
  try{ where=decodeURIComponent(music.src.split('/').slice(-2).join('/')); }catch(e){}
  alert_('Music file not found','looked for '+where,'#ff5a4a');
});

/* ---------- ROLLING ---------- */
/* Rolls a drop and reports the odds it was actually beaten at.
   trueP is the chance of getting exactly this difficulty AND exactly this
   set of modifiers with your current luck, so 1/trueP is what the game
   should call "rare" rather than the printed 1-in-N on the block. */
function rollDrop(bonus){
  const L=luck()*(bonus||1), FLOOR=BY_RARITY[0];
  let d=null, p=1, miss=1;
  for(const x of ROLL_ORDER){
    if(x===FLOOR) break;        /* the commonest one catches everything that gets this far,
                                   so rolling for it as well would double count its odds */
    const c=Math.min(1,L/x.r);
    if(Math.random()<c){ d=x; p=c*miss; break; }
    miss*=(1-c);
  }
  if(!d){ d=FLOOR; p=miss; }
  const ML=modLuck(), out=[];
  for(const m of MOD_ORDER){
    const c=Math.min(0.85,ML/m.r);
    if(Math.random()<c){ out.push(m.n); p*=c; }
    else p*=(1-c);
  }
  return {d, mods:out, trueRarity: p>0?1/p:Infinity};
}
const modLabel=mods=>mods.length?mods.join(' ')+' ':'';

/* The same maths rollDrop uses, but worked out rather than rolled, so the odds of
   any combination at your current luck can be shown anywhere. */
function trueOdds(d,mods,bonus){
  const L=luck()*(bonus||1), FLOOR=BY_RARITY[0];
  let p=0, miss=1;
  for(const x of ROLL_ORDER){
    if(x===FLOOR){ if(d===FLOOR) p=miss; break; }
    const c=Math.min(1,L/x.r);
    if(x===d){ p=c*miss; break; }
    miss*=(1-c);
  }
  if(!p) return Infinity;
  const ML=modLuck();
  for(const m of MOD_ORDER){
    const c=Math.min(0.85,ML/m.r);
    p *= (mods.indexOf(m.n)>=0)?c:(1-c);
  }
  return p>0?1/p:Infinity;
}

/* ---------- SPAWNING ---------- */
function spawn(bonus,fromX){
  if(blocks.length>=capacity()) makeRoom();
  const roll=rollDrop(bonus), d=roll.d, mods=roll.mods;
  const scale=sizeOf(mods);
  const tr=totalRarity(d,mods);
  /* calm mode banks anything at or under the auto collect line without ever putting
     it on the ground, so only the things you care about actually show up */
  if(S.set.calm&&S.set.autoCollect&&tr<=S.set.autoMax){
    bank({d,mods,rarity:tr,trueRarity:roll.trueRarity,value:value(d,mods)});
    updateHUD();
    return;
  }
  const b={d,mods,scale,rarity:tr,trueRarity:roll.trueRarity,value:value(d,mods),
           fy:(DROP_W*0.72)/Math.max(1,H), vy:0.12, landed:false};
  b.fx=Math.min(0.94,Math.max(0.06,(fromX==null?dropX:fromX)/W+rnd(-0.02,0.02)));
  b.target=groundFrac(d.s,b.fx)+rnd(0,0.006);
  const e=el('div','blk'); e.appendChild(buildVisual(d,mods));
  e.dataset.id=b.id=++uid;
  b.el=e; blocks.push(b); blocksEl.appendChild(e); place(b);

  /* Only shout about it if it really was rare. trueRarity already has your
     luck, modifier luck, mini-dropper bonus and overcharge folded in, so a
     1 in 1M block at 400x luck stays quiet. */
  if(roll.trueRarity>=S.set.alertAt){
    alert_(modLabel(mods)+d.n, odds(tr)+'  ·  1 in '+fmt(roll.trueRarity)+' at your luck', d.o||d.c);
    playSfx(tierFor(roll.trueRarity));
  } else if(S.set.cheapSounds) playSfx('1_1K-.wav',0.45);
  updateHUD();
}
function makeRoom(){
  let worst=null;
  for(const b of blocks) if(!worst||b.value<worst.value) worst=b;
  if(worst) removeBlock(worst);
}
/* When the ground fills up the dropper halts rather than quietly binning your
   blocks. If you leave it jammed for a while it gives up waiting and starts
   sweeping the cheapest ones so the game keeps moving. */
const JAM_GRACE=12000;
let jamSince=0;
function paintJam(){
  const box=$('#full'), full=blocks.length>=capacity();
  if(!full){ jamSince=0; box.classList.remove('on','sweep'); return; }
  if(!jamSince){ jamSince=Date.now(); beep(190,0.18,'square',0.09); }
  const sweeping=Date.now()-jamSince>JAM_GRACE;
  box.classList.add('on');
  box.classList.toggle('sweep',sweeping);
  $('#fullTitle').textContent=sweeping?'Sweeping the cheapest':'Ground is full';
  $('#fullSub').textContent=sweeping
    ? 'Out of room for too long, so the cheapest blocks are being cleared to keep it running.'
    : 'The dropper has stopped. Collect something to start it again ('
      +Math.ceil((JAM_GRACE-(Date.now()-jamSince))/1000)+'s).';
  return sweeping;
}
$('#fullBtn').onclick=()=>{
  const all=blocks.slice();
  if(!all.length) return;
  let total=0;
  all.forEach(b=>{ total+=b.value; collect(b); });
  alert_('Cleared '+all.length,'$'+fmt(total),'#8ff04a');
};
function removeBlock(b){
  const i=blocks.indexOf(b); if(i<0) return;
  blocks.splice(i,1); b.el.classList.add('gone');
  setTimeout(()=>b.el.remove(),300);
}

/* ---------- COLLECTING ---------- */
/* the money and record keeping half of collecting, with no display attached */
function bank(b){
  S.money+=b.value; S.totalCollected++;
  S.seen[b.d.n]=(S.seen[b.d.n]||0)+1;
  gRecord(b);
  if(!S.best||b.rarity>S.best.rarity)
    S.best={name:b.d.n,color:b.d.c,mods:b.mods.slice(),value:b.value,rarity:b.rarity,
            trueRarity:b.trueRarity||null,luckThen:luck()};
  if(Math.random()<gemChance()){ const g=gemsFor(b.rarity); S.gems+=g; return g; }
  return 0;
}
function collect(b){
  if(!b||b.collected) return;
  b.collected=true;
  const gained=bank(b);
  const f=el('div','float'); f.textContent='+$'+fmt(b.value);
  f.style.left=(b.fx*W-18)+'px'; f.style.top=(b.fy*H-b.size*0.6)+'px';
  fxEl.appendChild(f); setTimeout(()=>f.remove(),800);
  if(gained){
    const g=gained;
    const gf=el('div','float'); gf.textContent='+'+fmt(g)+' 💎';
    gf.style.color='#5fe7ff';
    gf.style.left=(b.fx*W-18)+'px'; gf.style.top=(b.fy*H-b.size*0.6-22)+'px';
    fxEl.appendChild(gf); setTimeout(()=>gf.remove(),800);
  }
  removeBlock(b);
  collectSfx();
  updateHUD();
}
function collectAll(){
  const list=blocks.filter(b=>b.rarity<=S.set.collectAllMax);
  if(!list.length){ alert_('Nothing matches that limit','',  '#ffcf3d'); return; }
  let total=0; list.forEach(b=>{total+=b.value; collect(b);});
  alert_('Collected '+list.length,'$'+fmt(total),'#8ff04a');
}

/* ---------- POINTER ---------- */
let holding=false;
function blockFromEl(node){
  const e=node&&node.closest?node.closest('.blk'):null;
  return e?blocks.find(b=>String(b.id)===e.dataset.id)||null:null;
}
scene.addEventListener('pointerdown',ev=>{
  /* let the music and overcharge controls have their own clicks */
  if(ev.target.closest&&ev.target.closest('#music,#oc,#full')) return;
  holding=true; scene.setPointerCapture&&scene.setPointerCapture(ev.pointerId);
  collect(blockFromEl(ev.target));
});
scene.addEventListener('pointermove',ev=>{
  if(holding){ collect(blockFromEl(document.elementFromPoint(ev.clientX,ev.clientY))); hideTip(); }
  else showTip(ev);
});
window.addEventListener('pointerup',()=>holding=false);
window.addEventListener('pointercancel',()=>holding=false);
scene.addEventListener('pointerleave',hideTip);
function showTip(ev){
  if(!S.set.tips) return;
  const b=blockFromEl(ev.target);
  if(!b){ hideTip(); return; }
  tipEl.innerHTML='<b>'+modLabel(b.mods)+b.d.n+'</b><br>'
    +'<span class="m">'+odds(b.rarity)+(b.d.sub?' &middot; sub of '+b.d.sub:'')+'</span><br>'
    +'<span class="p">$'+fmt(b.value)+'</span>';
  tipEl.style.opacity='1';
  const r=scene.getBoundingClientRect();
  let x=ev.clientX-r.left+16, y=ev.clientY-r.top+16;
  if(x>W-250) x=W-250; if(y>H-95) y=ev.clientY-r.top-80;
  tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
}
function hideTip(){ tipEl.style.opacity='0'; }
function alert_(text,sub,color){
  const a=el('div','alert'); a.textContent=text;
  if(sub){ const s=el('small'); s.textContent=sub; a.appendChild(s); }
  if(color) a.style.borderColor=color;
  const box=$('#alerts');
  box.appendChild(a);
  while(box.children.length>4) box.firstChild.remove();
  setTimeout(()=>a.remove(),3000);
}

/* ---------- LOOP: dropper moves to a random spot, pauses, then drops ---------- */
let dropX=0, dropFrom=0, dropTo=0, travelDur=800, cycleT=0, last=performance.now();
const easeIO=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function newCycle(){
  dropFrom=dropX;
  let t=dropTo;
  for(let i=0;i<12;i++){ t=rnd(0.10,0.90)*W; if(Math.abs(t-dropFrom)>W*0.22) break; }
  dropTo=t;
  /* travel fills the whole cycle apart from a short hold while it releases */
  const delay=dropDelay(), hold=Math.min(320,delay*0.25);
  travelDur=Math.max(120,delay-hold);
  cycleT=0;
}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const delay=dropDelay();
  if(!running){ drawSky(dt); tickBars(); requestAnimationFrame(frame); return; }
  const jammed=blocks.length>=capacity(), sweeping=paintJam();
  const halted=jammed&&!sweeping;
  if(!halted) cycleT+=dt*1000;
  dropX=dropFrom+(dropTo-dropFrom)*easeIO(Math.min(1,cycleT/travelDur));
  dropperEl.style.left=dropX+'px';
  timerBar.style.width=Math.min(100,(cycleT/delay)*100)+'%';
  drawSky(dt); if(!halted) tickMini(); updateOC(); tickBars();
  if(!halted&&cycleT>=delay){
    const n=1+S.up.multi;
    for(let i=0;i<n;i++) setTimeout(()=>spawn(1),i*110);
    dropperEl.animate?dropperEl.animate(
      [{transform:'translateX(-50%) translateY(0)'},{transform:'translateX(-50%) translateY(7px)'},
       {transform:'translateX(-50%) translateY(0)'}],{duration:200}):0;
    newCycle();
  }
  for(const b of blocks){
    if(b.landed) continue;
    b.vy+=1.9*dt; b.fy+=b.vy*dt;
    if(b.fy>=b.target){
      b.fy=b.target; b.landed=true;
      if(S.set.autoCollect&&b.rarity<=S.set.autoMax) setTimeout(()=>collect(b),90);
    }
    place(b);
  }
  requestAnimationFrame(frame);
}

  if(mgCleanup){ mgCleanup(); mgCleanup=null; }
  modal.classList.remove('on'); reopen=null; save();
}
$('#btnClose').onclick=closeModal;
modal.addEventListener('pointerdown',e=>{if(e.target===modal)closeModal();});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ---------- SHOP ---------- */
function renderShop(root){
  const h=el('div','hint');
  h.innerHTML='Luck multiplies the chance of every difficulty. Current luck <b>&times;'+fmt(luck())
    +'</b> &middot; modifier chance <b>&times;'+modLuck().toFixed(2)
    +'</b> &middot; a drop every <b>'+(dropDelay()/1000).toFixed(2)+'s</b>'
    +(S.sup.prism?' &middot; Prism core is adding <b class="gem">&times;'+prismMult().toFixed(2)+'</b>':'')+'.';
  root.appendChild(h);
  Object.keys(UP).forEach(k=>{
    const u=UP[k], lv=S.up[k], maxed=lv>=u.max, c=cost(k);
    const row=el('div','up'), info=el('div','info');
    let extra='';
    if(k==='dropper') extra=' — '+DROPPERS[lv].name+(maxed?'':', next: '+DROPPERS[lv+1].name);
    info.innerHTML='<h3>'+u.name+'</h3><p>'+u.desc+'</p>'
      +'<div class="lvl">Level '+lv+' / '+u.max+extra+'</div>';
    const btn=el('button','btn buy');
    if(maxed){btn.textContent='Maxed'; btn.disabled=true;}
    else{
      btn.textContent='$'+fmt(c); btn.disabled=S.money<c;
      btn.onclick=()=>{ if(S.money<cost(k))return;
        S.money-=cost(k); S.up[k]++;
        if(k==='dropper') paintDropper();
        beep(680,0.12,'square',0.12); save(); refresh(); };
    }
    row.appendChild(info); row.appendChild(btn); root.appendChild(row);
  });

  /* second machine */
  const row=el('div','up'), info=el('div','info');
  info.innerHTML='<h3>Mini dropper</h3><p>A second machine on the left. It only fires once every '
    +Math.round(miniWait()/1000)+' seconds, but that single spawn rolls at <b>&times;'+fmt(miniLuck())
    +'</b> luck. Mini reactor in the Super shop makes it faster and luckier.</p>'
    +'<div class="lvl">'+(S.mini?'Installed':'Not installed')+'</div>';
  const b2=el('button','btn buy');
  if(S.mini){ b2.textContent='Owned'; b2.disabled=true; }
  else{
    b2.textContent='$'+fmt(MINI_COST); b2.disabled=S.money<MINI_COST;
    b2.onclick=()=>{
      if(S.money<MINI_COST||S.mini) return;
      S.money-=MINI_COST; S.mini=true; S.miniT=Date.now();
      paintMini(); beep(760,0.16,'square',0.13);
      alert_('Mini dropper installed','one high-luck spawn every '+Math.round(miniWait()/1000)+'s','#8ff04a');
      save(); refresh();
    };
  }
  row.appendChild(info); row.appendChild(b2); root.appendChild(row);
}

/* ---------- SUPER SHOP ---------- */
function renderSuper(root){
  const h=el('div','hint');
  h.innerHTML='Diamonds come from collecting. Every collect has a <b class="gem">'
    +(gemChance()*100).toFixed(0)+'%</b> chance to also pay <b>&radic;rarity</b> diamonds, '
    +'so one lucky rare is worth thousands of commons. You have <b class="gem">'+fmt(S.gems)+'</b>.';
  root.appendChild(h);
  Object.keys(SUP).forEach(k=>{
    const u=SUP[k], lv=S.sup[k], maxed=lv>=u.max, c=supCost(k);
    const row=el('div','up'), info=el('div','info');
    let extra='';
    if(k==='prism')    extra=' &middot; now &times;'+prismMult().toFixed(2)+' luck';
    if(k==='vault')    extra=' &middot; money is &times;'+marketMult().toFixed(2);
    if(k==='polish')   extra=' &middot; '+(gemChance()*100).toFixed(0)+'% chance';
    if(k==='reactor')  extra=S.mini?' &middot; &times;'+fmt(miniLuck())+' every '+Math.round(miniWait()/1000)+'s'
                                   :' &middot; buy the mini dropper first';
    if(k==='overload'&&lv) extra=' &middot; &times;'+ocLuck()+' luck for '+(ocDur()/1000)+'s, '+(ocCool()/1000)+'s cooldown';
    if(k==='refinery') extra=' &middot; modifier luck &times;'+modLuck().toFixed(2);
    if(k==='room')     extra=' &middot; room for '+capacity();
    info.innerHTML='<h3>'+u.name+'</h3><p>'+u.desc+'</p>'
      +'<div class="lvl">Level '+lv+' / '+u.max+extra+'</div>';
    const btn=el('button','btn gemb buy');
    if(maxed){ btn.textContent='Maxed'; btn.disabled=true; }
    else{
      btn.innerHTML=fmt(c)+' 💎'; btn.disabled=S.gems<c;
      btn.onclick=()=>{
        const cc=supCost(k);
        if(S.gems<cc) return;
        S.gems-=cc; S.sup[k]++;
        if(k==='reactor') paintMini();
        beep(980,0.12,'triangle',0.12); save(); refresh();
      };
    }
    row.appendChild(info); row.appendChild(btn); root.appendChild(row);
  });
}

/* ---------- INDEX ---------- */
let sel=BY_RARITY[0], selMods=[];
const MOD_SORTED=MODS.slice().sort((a,b)=>a.r-b.r);
function renderIndex(root){
  const pw=el('div'); pw.id='previewWrap';
  const pv=el('div'); pv.id='preview';
  const pi=el('div'); pi.id='previewInner'; pv.appendChild(pi);
  const right=el('div'); right.style.flex='1 1 260px';
  const title=el('h4','sec'); title.id='pvTitle';
  const ml=el('div'); ml.id='modList';
  MOD_SORTED.forEach(m=>{
    const l=el('label','mchk'), cb=el('input');
    cb.type='checkbox'; cb.checked=selMods.indexOf(m.n)>=0;
    cb.onchange=()=>{
      if(cb.checked) selMods.push(m.n);
      else { const i=selMods.indexOf(m.n); if(i>=0) selMods.splice(i,1); }
      renderIndexPreview();
    };
    l.appendChild(cb); l.appendChild(document.createTextNode(m.n));
    const sp=el('span'); sp.textContent='1/'+m.r; l.appendChild(sp);
    ml.appendChild(l);
  });
  const clr=el('button','btn alt'); clr.textContent='Clear modifiers';
  clr.style.marginTop='8px'; clr.onclick=()=>{selMods=[]; refresh();};
  right.appendChild(title); right.appendChild(ml); right.appendChild(clr);
  pw.appendChild(pv); pw.appendChild(right); root.appendChild(pw);

  const names={1:'Grasslands',2:'Rocks',3:'City',4:'Eye City'};
  for(let st=1;st<=4;st++){
    const hd=el('h4','sec'); hd.textContent='Stage '+st+' — '+names[st]; root.appendChild(hd);
    const g=el('div','grid');
    BY_RARITY.filter(d=>d.s===st).forEach(d=>{
      const c=el('div','dcell'+(d===sel?' sel':'')+((S.seen[d.n]||0)?'':' locked'));
      const sq=el('div','sq'); sq.innerHTML=shapeSVG(d,null); c.appendChild(sq);
      const nm=el('div','nm'); nm.textContent=d.n; c.appendChild(nm);
      const rr=el('div','rr'); rr.textContent=odds(d.r); c.appendChild(rr);
      const ct=el('div','ct'); ct.textContent='found '+(S.seen[d.n]||0); c.appendChild(ct);
      const gc=el('div','gct'); gc.textContent='🌐 '+fmt(gDiffCount(d)); 
      gc.title=gDiffCount(d)+' collected ('+gLabel()+')'; c.appendChild(gc);
      c.onclick=()=>{sel=d; refresh();};
      g.appendChild(c);
    });
    root.appendChild(g);
  }
  renderIndexPreview();
}
function renderIndexPreview(){
  const pi=$('#previewInner'); if(!pi) return;
  pi.innerHTML='';
  const scale=sizeOf(selMods);
  const box=el('div'), pct=Math.min(96,42*Math.pow(scale,0.45)).toFixed(1);
  box.style.cssText='position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:'
    +pct+'%;height:'+pct+'%';
  box.appendChild(buildVisual(sel,selMods)); pi.appendChild(box);
  const t=$('#pvTitle');
  if(t) t.innerHTML=modLabel(selMods)+sel.n+' &middot; <b>'+odds(totalRarity(sel,selMods))
    +'</b> &middot; size &times;'+(+scale.toFixed(2))+' &middot; $'+fmt(value(sel,selMods))
    +'<div class="gline">🌐 '+globalComboLine(sel,selMods)+'</div>'
    +'<div class="gline">🎯 '+odds(trueOdds(sel,selMods))+' at your current luck</div>';
}

/* ---------- SETTINGS ---------- */
function diffSelect(v,onchange,withInf){
  const s=el('select');
  if(withInf){const o=el('option'); o.value='Infinity'; o.textContent='Infinity (everything)'; s.appendChild(o);}
  const o0=el('option'); o0.value='0'; o0.textContent='Nothing'; s.appendChild(o0);
  BY_RARITY.forEach(d=>{const o=el('option'); o.value=String(d.r);
    o.textContent=d.n+'  ('+odds(d.r)+')'; s.appendChild(o);});
  s.value=v===Infinity?'Infinity':String(v);
  s.onchange=()=>onchange(s.value==='Infinity'?Infinity:Number(s.value));
  return s;
}
function toggleBtn(on,onclick,labels){
  const b=el('button','tog'+(on?'':' off'));
  b.textContent=on?(labels?labels[0]:'Yes'):(labels?labels[1]:'No');
  b.onclick=onclick; return b;
}
function renderSettings(root){
  const mk=(t,d,ctrl)=>{const r=el('div','row'),i=el('div','info');
    i.innerHTML='<h3>'+t+'</h3><p>'+d+'</p>'; r.appendChild(i); r.appendChild(ctrl); root.appendChild(r);};
  mk('Auto-collect','Grab difficulties the moment they land, up to the limit below.',
     toggleBtn(S.set.autoCollect,()=>{S.set.autoCollect=!S.set.autoCollect;save();refresh();},['On','Off']));
  const rarityBox=(get,set,note)=>{
    const wrap=el('div'); wrap.style.cssText='display:flex;align-items:center;gap:6px;flex-wrap:wrap';
    const pre=el('span'); pre.textContent='1 in'; pre.style.cssText='font-weight:800;opacity:.8';
    const inp=el('input'); inp.type='text'; inp.inputMode='numeric';
    inp.value=get()===Infinity?'everything':String(get());
    inp.style.cssText='font-family:var(--f);font-weight:800;font-size:15px;padding:6px 8px;width:120px;'
      +'border:3px solid var(--lime-edge);border-radius:9px;background:#eaffdc;color:var(--lime-ink);text-align:right';
    const apply=()=>{
      const raw=inp.value.trim().toLowerCase().replace(/[, ]/g,'');
      let v;
      if(raw==='everything'||raw==='all'||raw==='inf') v=Infinity;
      else {
        const m=raw.match(/^([0-9.]+)([kmbt]?)$/);
        if(m){ v=parseFloat(m[1])*({'':1,k:1e3,m:1e6,b:1e9,t:1e12})[m[2]]; }
      }
      if(v===undefined||isNaN(v)||v<1){ inp.value=get()===Infinity?'everything':String(get()); return; }
      set(v); save();
      inp.value=v===Infinity?'everything':String(Math.round(v));
      if(note) note.textContent=describeCut(v);
    };
    inp.onchange=apply;
    inp.onblur=apply;
    inp.onkeydown=e=>{ e.stopPropagation(); if(e.key==='Enter') inp.blur(); };
    wrap.appendChild(pre); wrap.appendChild(inp);
    return wrap;
  };
  const describeCut=v=>{
    if(v===Infinity) return 'Everything gets taken.';
    let name=null;
    for(const d of BY_RARITY) if(d.r<=v) name=d.n;
    return name?('That is a plain '+name+' and anything below it.'):'Nothing reaches that yet.';
  };
  const acNote=el('div'); acNote.style.cssText='font-size:11.5px;opacity:.7;margin-top:4px';
  acNote.textContent=describeCut(S.set.autoMax);
  mk('Auto-collect up to','Type any number. Compares the <b>full</b> rarity, so a Gargantuan Easy is '
     +'safe from it. You can use shorthand like 50k or 2m.',
     rarityBox(()=>S.set.autoMax,v=>{S.set.autoMax=v;},acNote));
  root.lastChild.querySelector('.info').appendChild(acNote);
  mk('Collect All limit','Same idea for the Collect All button. Type <b>everything</b> for no limit.',
     rarityBox(()=>S.set.collectAllMax,v=>{S.set.collectAllMax=v;syncCA();},null));
  mk('Calm mode','Quietens everything down once the machine gets busy. Anything at or under '
     +'your auto-collect number is banked without ever appearing, blocks are drawn smaller, and '
     +'the spinning, jittering, blinking and disco effects hold still. Needs auto-collect on to '
     +'filter spawns.',
     toggleBtn(S.set.calm,()=>{S.set.calm=!S.set.calm;save();refresh();
       blocks.forEach(place);},['On','Off']));
  mk('Sound','Spawn sounds, collect sound and menu clicks.',
     toggleBtn(S.set.sounds,()=>{S.set.sounds=!S.set.sounds;save();refresh();},['On','Off']));
  const vol=(label,desc,key,after)=>{
    const r=el('div','row'), i=el('div','info');
    i.innerHTML='<h3>'+label+'</h3><p>'+desc+'</p>';
    const sl=el('input'); sl.type='range'; sl.min=0; sl.max=1; sl.step=0.05; sl.value=S.set[key];
    sl.style.cssText='flex:1 1 160px;accent-color:#8ff04a;cursor:pointer';
    const out=el('div'); out.style.cssText='font-weight:800;min-width:46px;text-align:right';
    out.textContent=Math.round(S.set[key]*100)+'%';
    sl.oninput=()=>{ S.set[key]=+sl.value; out.textContent=Math.round(S.set[key]*100)+'%';
                     if(after) after(); save(); };
    r.appendChild(i); r.appendChild(sl); r.appendChild(out); root.appendChild(r);
  };
  vol('Sound effect volume','How loud the spawn and collect sounds are.','sfxVol');
  vol('Music volume','','musVol',()=>{ music.volume=S.set.musVol; });
  const ldRow=el('div','row'), ldInfo=el('div','info');
  ldInfo.innerHTML='<h3>Audio files</h3><p>Sounds and music load from the <b>audio</b> folder '
    +'sitting next to this page. Right now that means:</p>'
    +'<p style="font-size:11px;opacity:.8;word-break:break-all"><code>'+absURL('Collect.wav')+'</code></p>'
    +'<p>Paste that into a new tab to test it. If it does not play, the file is not where the page '
    +'is looking. You can also pick the files by hand here and they will play for this session.</p>';
  const ld=el('button','btn alt'); ld.textContent='Load audio files';
  const inp=el('input'); inp.type='file'; inp.multiple=true; inp.accept='audio/*'; inp.style.display='none';
  inp.onchange=()=>{
    let n=0;
    [...inp.files].forEach(f=>{ audioURL[f.name]=URL.createObjectURL(f); n++; });
    primeSfx(); if(music.src) loadTrack(S.track,!music.paused);
    alert_('Loaded '+n+' audio files','','#5fe7ff');
  };
  ld.onclick=()=>inp.click();
  const testBtn=el('button','btn alt'); testBtn.textContent='Check audio files';
  const testOut=el('div'); testOut.style.cssText='font-size:11.5px;line-height:1.5;margin-top:6px;width:100%';
  testBtn.onclick=()=>{
    testBtn.textContent='Checking…';
    testOut.innerHTML='';
    checkAudio(res=>{
      testBtn.textContent='Check audio files';
      const bad=res.filter(r=>!r.ok);
      testOut.innerHTML='<b>'+(res.length-bad.length)+' of '+res.length+' files found.</b>'
        +'<br>Looking in: <code style="opacity:.75">'+AUDIO_DIR+'</code> next to this page.'
        +(bad.length?'<br><span style="color:#ff9d8a">Missing: '+bad.map(r=>r.f).join(', ')
          +'</span><br>Check the folder is called <b>audio</b> in lower case and sits beside index.html.'
         :'<br><span style="color:#8ff04a">All present.</span>');
    });
  };
  ldRow.appendChild(ldInfo); ldRow.appendChild(ld); ldRow.appendChild(testBtn);
  ldRow.appendChild(inp); ldRow.appendChild(testOut); root.appendChild(ldRow);
  mk('Spawn sounds for 1K- difficulties','Also blip for common drops. Noisy at high drop rates.',
     toggleBtn(S.set.cheapSounds,()=>{S.set.cheapSounds=!S.set.cheapSounds;save();refresh();}));
  const alertSel=el('select');
  [[1000,'1 in 1,000 (default)'],[10000,'1 in 10,000'],[100000,'1 in 100,000'],
   [1000000,'1 in 1 million'],[1e9,'1 in 1 billion']].forEach(o=>{
    const op=el('option'); op.value=String(o[0]); op.textContent=o[1]; alertSel.appendChild(op);
  });
  alertSel.value=String(S.set.alertAt);
  alertSel.onchange=()=>{ S.set.alertAt=Number(alertSel.value); save(); };
  mk('Announce drops above','Uses the <b>true</b> odds, with your luck, modifier luck, overcharge and '
     +'the mini dropper all counted in. A 1 in 1M block at 1000x luck is really 1 in 1,000, so it stays quiet.',
     alertSel);
  mk('Hover tooltips','Show name, odds and value when you point at a difficulty.',
     toggleBtn(S.set.tips,()=>{S.set.tips=!S.set.tips;save();refresh();},['On','Off']));
  /* shared counter setup */
  const gr=el('div','row'), gi=el('div','info');
  const localFile=location.protocol==='file:';
  const state = gMode==='shared' ? 'Connected through Claude. The numbers are shared.'
    : localFile ? '<b style="color:#ffcf3d">You have opened this page straight from your computer, '
        +'and browsers block pages opened that way from talking to the internet. The shared counter '
        +'can only work once the game is published online.</b>'
    : gMode==='blob' ? (gWriteBlocked
        ? '<b style="color:#ffcf3d">Half connected.</b> It can read everyone\'s totals but cannot '
          +'add yours to them, because this store does not accept writes from a web page. '
          +'The README has a free alternative that does.'
        : (gWarn?'<b style="color:#ff9d8a">'+gWarn+'</b>'
                :'Connected. The numbers are shared with everyone playing.'))
    : 'Not connected, so the globe numbers are only yours.';
  gi.innerHTML='<h3>🌐 Shared counter</h3><p>'+state+'</p>'
    +(gMode==='shared'?''
      : (gMode==='blob'&&!gWriteBlocked)
        ? '<p style="font-size:12px;opacity:.75">Everyone who opens this page shares this counter. '
          +'Its address is kept in <b>GLOBAL_ID</b> at the top of index.html, so nobody else has to '
          +'set anything up. The box below only changes it for this browser.</p>'
        : '<p style="font-size:12px;opacity:.75">This needs a counter that accepts writing. Free JSON '
          +'stores generally allow a web page to read from them but not write to them, so they will '
          +'not do. <b>worker.js</b> and the Global statistics part of the README walk through setting '
          +'up a free one that works. Paste its address below, or into <b>GLOBAL_ID</b> at the top of '
          +'index.html so everybody shares it.</p>');
  gr.appendChild(gi);
  if(gMode!=='shared'){
    const wrap=el('div'); wrap.style.cssText='display:flex;gap:8px;flex-wrap:wrap;align-items:center';
    const inp=el('input'); inp.type='text'; inp.placeholder='paste your code';
    inp.value=S.globalId||GLOBAL_ID||'';
    inp.style.cssText='font-family:var(--f);font-weight:700;font-size:14px;padding:7px 9px;width:190px;'
      +'border:3px solid var(--lime-edge);border-radius:9px;background:#eaffdc;color:var(--lime-ink)';
    const useBtn=el('button','btn'); useBtn.textContent='Use code';
    useBtn.onclick=async()=>{
      S.globalId=inp.value.trim();
      save(); gWarn='';
      useBtn.textContent='Checking…';
      G=mergeG({total:0,diff:{},mod:{},combo:{},rarest:null},await GNet.read());
      paintGlobalBest(); refresh();
      alert_(gWarn?'Could not connect':'Shared counter connected',gWarn||'',gWarn?'#ff5a4a':'#8ff04a');
    };
    const newBtn=el('button','btn alt'); newBtn.textContent='Make me one';
    newBtn.title='Creates a free jsonblob store. Note that these can be read but not written '
      +'to from a web page, so it will only get you halfway.';
    newBtn.onclick=async()=>{
      newBtn.textContent='Making…';
      try{
        const id=await GNet.create();
        inp.value=id; S.globalId=id; gWarn=''; save();
        G=mergeG({total:0,diff:{},mod:{},combo:{},rarest:null},await GNet.read());
        paintGlobalBest(); refresh();
        alert_('Counter created','paste '+id+' into GLOBAL_ID','#8ff04a');
      }catch(e){
        newBtn.textContent='Make me one';
        alert_('Could not make one automatically','use the jsonblob.com steps instead','#ff5a4a');
      }
    };
    if(S.globalId&&GLOBAL_ID&&S.globalId!==GLOBAL_ID){
      const warn=el('div');
      warn.style.cssText='width:100%;font-size:11.5px;color:#ffcf3d;margin-top:4px';
      warn.textContent='Heads up: the code saved in this browser is being used instead of the one '
        +'in index.html. Press Clear to go back to the file\'s one.';
      gr.appendChild(warn);
    }
    const clrBtn=el('button','btn alt'); clrBtn.textContent='Clear';
    clrBtn.onclick=async()=>{
      S.globalId=''; save(); gWarn=''; gWriteBlocked=false;
      G=mergeG({total:0,diff:{},mod:{},combo:{},rarest:null},await GNet.read());
      paintGlobalBest(); refresh();
    };
    const testBtn2=el('button','btn alt'); testBtn2.textContent='Test connection';
    const tOut=el('div');
    tOut.style.cssText='width:100%;font-size:11.5px;line-height:1.5;margin-top:7px;word-break:break-all';
    testBtn2.onclick=()=>{
      tOut.innerHTML=''; testBtn2.textContent='Testing…';
      const colours={0:'#ff9d8a',1:'#c7d6e4',2:'#ffd9a8',3:'#8ff04a'};
      testGlobal((line,kind)=>{
        const d=el('div');
        d.style.color=colours[kind]||'#c7d6e4';
        if(kind===2){ d.style.cssText+=';background:rgba(0,0,0,.3);border-radius:6px;padding:3px 6px;font-size:11px'; }
        d.textContent=line;
        tOut.appendChild(d);
        testBtn2.textContent='Test connection';
      });
    };
    wrap.appendChild(inp); wrap.appendChild(useBtn); wrap.appendChild(clrBtn);
    wrap.appendChild(newBtn); wrap.appendChild(testBtn2);
    gr.appendChild(wrap); gr.appendChild(tOut);
  }
  root.appendChild(gr);

  const st=el('div','hint');
  st.innerHTML='Collected <b>'+fmt(S.totalCollected)+'</b> difficulties &middot; <b>'
    +Object.keys(S.seen).length+' / '+DIFFS.length+'</b> discovered &middot; <b class="gem">'
    +fmt(S.gems)+'</b> diamonds banked.';
  root.appendChild(st);
  const rst=el('button','btn close'); rst.textContent='Reset everything';
  rst.onclick=async()=>{
    if(rst.dataset.sure!=='1'){rst.dataset.sure='1'; rst.textContent='Tap again to wipe your save'; return;}
    await Store.wipe(); location.reload();
  };
  root.appendChild(rst);
}

/* ---------- SAVE ---------- */
function snapshot(){
  return {v:SAVE_VERSION,money:S.money,up:S.up,best:S.best,seen:S.seen,total:S.totalCollected,
    gems:S.gems,sup:S.sup,mini:S.mini,track:S.track,mgAt:S.mgAt,globalId:S.globalId,
    mergeBoard:S.mergeBoard,
    set:{...S.set,collectAllMax:S.set.collectAllMax===Infinity?-1:S.set.collectAllMax},
    field:blocks.slice(0,90).map(b=>({n:b.d.n,m:b.mods,x:b.fx,y:b.fy,t:b.target,s:b.scale}))};
}
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>Store.save(snapshot()),400); }
function applySave(o){
  if(!o) return;
  if((o.v||1)!==SAVE_VERSION){
    /* save is from before the last reset, so it is thrown away rather than loaded */
    Store.wipe();
    setTimeout(()=>alert_('Fresh start','the game was rebalanced, so everyone begins again','#8ff04a'),1200);
    return;
  }
  S.money=o.money||0; Object.assign(S.up,o.up||{});
  S.gems=o.gems||0; Object.assign(S.sup,o.sup||{});
  S.mini=!!o.mini; S.miniT=Date.now(); S.track=o.track||0; S.mgAt=o.mgAt||{};
  S.globalId=o.globalId||''; S.mergeBoard=o.mergeBoard||null;
  S.best=o.best||null; S.seen=o.seen||{}; S.totalCollected=o.total||0;
  if(o.set){Object.assign(S.set,o.set);
    S.set.collectAllMax=o.set.collectAllMax===-1?Infinity:o.set.collectAllMax;}
  (o.field||[]).forEach(f=>{
    const d=BY_NAME[f.n]; if(!d) return;
    const mods=(f.m||[]).filter(n=>MOD_BY[n]);
    const b={d,mods,scale:f.s||1,rarity:totalRarity(d,mods),value:value(d,mods),
             fx:f.x,fy:f.y,target:f.t,vy:0,landed:true};
    const e=el('div','blk'); e.appendChild(buildVisual(d,mods));
    e.dataset.id=b.id=++uid; b.el=e; blocks.push(b); blocksEl.appendChild(e);
  });
}

/* ============================================================
   OPENING CUTSCENE AND TITLE SCREEN
   ============================================================ */
let running=false;
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function showTitle(){
  $('#cine').style.display='none';
  $('#title').classList.add('on');
  $('#playBtn').focus();
}
function runCutscene(){
  const cine=$('#cine'), cam=$('#cineCam'), drop=$('#cineDrop'),
        blk=$('#cineBlk'), dust=$('#cineDust'), fade=$('#cineFade');
  const Wv=innerWidth, Hv=innerHeight;

  /* The cutscene needs the world at the whole window's shape, but buildBG
     also rewrites the shared ground-height table, so the real one is put back
     straight afterwards or blocks would land at the wrong heights. */
  const keepBands=BANDS, keepW=WORLD_W;
  const cw=Math.round(Math.max(420,Math.min(3400,WORLD_H*(Wv/Math.max(1,Hv)))));
  $('#cineBg').setAttribute('viewBox','0 0 '+cw+' '+WORLD_H);
  $('#cineBg').innerHTML=buildBG(cw);
  BANDS=keepBands; WORLD_W=keepW;

  const dw=Math.max(190,Math.min(Wv*0.28,320)), dh=dw*152/200;
  drop.innerHTML=dropperSVG(S.up.dropper);
  const dsvg=drop.querySelector('svg');
  dsvg.setAttribute('width',dw); dsvg.setAttribute('height',dh);

  const chuteY=dh*0.93;
  const bs=Math.max(44,Math.min(Hv*0.085,74));
  blk.style.width=bs+'px'; blk.style.height=bs+'px';
  blk.style.left=(Wv/2-bs/2)+'px';
  blk.style.top=(chuteY-bs*0.55)+'px';
  blk.innerHTML='';
  const inner=el('div'); inner.style.cssText='width:100%;height:100%';
  inner.appendChild(buildVisual(BY_NAME['Easy'],[]));
  blk.appendChild(inner);

  const landTop=(730/WORLD_H)*Hv-bs*BOTTOM_FRAC;
  const fall=Math.max(40,landTop-(chuteY-bs*0.55));
  const K=2.6, Ty=Hv*0.5-chuteY;
  cam.style.transformOrigin='50% '+chuteY+'px';
  cam.style.transform='translateY('+Ty+'px) scale('+K+')';

  if(reduceMotion||!cine.animate){ showTitle(); return; }

  const A=(node,frames,opts)=>node.animate&&node.animate(frames,Object.assign({fill:'both'},opts));

  fade.animate([{opacity:1},{opacity:0}],{duration:850,delay:350,easing:'ease-out',fill:'both'});
  A(drop,[{transform:'translateX(-50%) translateY(-'+(dh+30)+'px)'},
          {transform:'translateX(-50%) translateY(14px)',offset:0.72},
          {transform:'translateX(-50%) translateY(0)'}],
    {duration:900,delay:500,easing:'cubic-bezier(.35,.9,.4,1)'});
  A(drop,[{transform:'translateX(-50%) translateY(0)'},
          {transform:'translateX(-52%) translateY(4px)',offset:0.3},
          {transform:'translateX(-48%) translateY(-2px)',offset:0.6},
          {transform:'translateX(-50%) translateY(0)'}],
    {duration:380,delay:1500,easing:'ease-in-out'});
  setTimeout(()=>beep(150,0.22,'square',0.1),1500);

  A(blk,[{transform:'translateY(0) scale(.55)',opacity:0,offset:0},
         {transform:'translateY(6px) scale(1)',opacity:1,offset:0.06},
         {transform:'translateY('+fall+'px)',opacity:1,offset:0.84},
         {transform:'translateY('+(fall-22)+'px)',opacity:1,offset:0.92},
         {transform:'translateY('+fall+'px)',opacity:1,offset:1}],
    {duration:2100,delay:1600,easing:'cubic-bezier(.38,0,.85,.6)'});

  A(cam,[{transform:'translateY('+Ty+'px) scale('+K+')'},
         {transform:'translateY(0px) scale(1)'}],
    {duration:1750,delay:2050,easing:'cubic-bezier(.55,0,.2,1)'});

  setTimeout(()=>{
    dust.style.width='10px'; dust.style.height='10px';
    dust.style.left=(Wv/2-5)+'px';
    dust.style.top=(landTop+bs*0.86)+'px';
    A(dust,[{transform:'scale(1)',opacity:.7},{transform:'scale(9,3.2)',opacity:0}],
      {duration:520,easing:'ease-out'});
    beep(320,0.12,'sine',0.09);
  },3380);

  setTimeout(()=>{
    cine.animate([{opacity:1},{opacity:0}],{duration:550,easing:'ease-in',fill:'both'});
    setTimeout(showTitle,430);
  },3950);
}

function startGame(){
  const t=$('#title');
  t.classList.remove('on');
  $('#cine').style.display='none';
  if(running) return;
  running=true;
  lastDropReset();
  /* the play button is a real click, so the browser lets the music start here */
  tryStartMusic();
  setTimeout(audioDiagnose,600);
  updateHUD();
}
function lastDropReset(){ cycleT=0; last=performance.now(); newCycle(); }
$('#playBtn').onclick=startGame;
$('#skip').onclick=()=>{ $('#cine').style.display='none'; showTitle(); };
$('#helpBtn').onclick=()=>{ $('#title').classList.remove('on'); openModal('How to play',renderHelp); };
$('#btnHelp').onclick=()=>openModal('How to play',renderHelp);

/* ---------- STATS ---------- */
function renderStats(root){
  const tbl=(title,rows)=>{
    const d=el('div','hsec');
    d.innerHTML='<h3>'+title+'</h3>'
      +'<table style="width:100%;border-collapse:collapse;font-size:13px">'
      +rows.map(r=>'<tr'+(r[2]?' style="font-weight:800;color:#fff"':'')+'>'
        +'<td style="padding:3px 0;opacity:'+(r[2]?1:.82)+'">'+r[0]+'</td>'
        +'<td style="padding:3px 0;text-align:right;white-space:nowrap">'+r[1]+'</td></tr>').join('')
      +'</table>';
    root.appendChild(d);
  };
  const x=v=>'&times;'+fmt(v);

  tbl('Luck',[
    ['Dropper — '+DROPPERS[S.up.dropper].name, x(DROPPERS[S.up.dropper].luck)],
    ['Fortune (level '+S.up.fortune+')', x(1+0.10*S.up.fortune)],
    ['Prism core (level '+S.sup.prism+')', x(prismMult())],
    ['Overcharge', S.sup.overload?(ocActive()?x(ocLuck())+' — running now':x(ocLuck())+' when used'):'not owned'],
    ['<b>Total luck right now</b>', '<b>'+x(luck())+'</b>', 1]
  ]);

  tbl('Money',[
    ['Market deal (level '+S.up.market+')', x(1+0.15*S.up.market)],
    ['Diamond vault (level '+S.sup.vault+')', x(1+0.5*S.sup.vault)],
    ['Golden modifier', '&times;2 on top'],
    ['<b>Every collect is worth</b>', '<b>'+x(marketMult())+'</b>', 1]
  ]);

  tbl('Modifier luck',[
    ['Mutation field (level '+S.up.mutation+')', x(1+0.12*S.up.mutation)],
    ['Refinery (level '+S.sup.refinery+')', x(1+0.25*S.sup.refinery)],
    ['<b>Total modifier luck</b>', '<b>'+x(modLuck())+'</b>', 1]
  ]);

  tbl('The machine',[
    ['A drop every', (dropDelay()/1000).toFixed(2)+'s'],
    ['Difficulties per drop', String(1+S.up.multi)],
    ['Ground space', String(capacity())],
    ['Mini dropper', S.mini?(x(miniLuck())+' luck every '+Math.round(miniWait()/1000)+'s'):'not owned'],
    ['Diamond chance per collect', (gemChance()*100).toFixed(0)+'%'],
    ['Announcing above', odds(S.set.alertAt)+' true']
  ]);

  if(S.best){
    const d=BY_NAME[S.best.name];
    const now=d?trueOdds(d,S.best.mods||[]):null;
    tbl('Your rarest find',[
      ['What it was', modLabel(S.best.mods||[])+S.best.name],
      ['Listed odds', odds(S.best.rarity)],
      ['True odds when you got it',
        S.best.trueRarity?odds(S.best.trueRarity):'<span style="opacity:.6">found before this was tracked</span>'],
      ['Luck you had then', S.best.luckThen?x(S.best.luckThen):'<span style="opacity:.6">unknown</span>'],
      ['<b>True odds at your luck now</b>', '<b>'+(now?odds(now):'—')+'</b>', 1],
      ['Worth', '$'+fmt(S.best.value)]
    ]);
  }

  tbl('Totals',[
    ['Money', '$'+fmt(S.money)],
    ['Diamonds', fmt(S.gems)],
    ['Difficulties collected', fmt(S.totalCollected)],
    ['Kinds discovered', Object.keys(S.seen).length+' / '+DIFFS.length],
    ['On the ground now', blocks.length+' / '+capacity()],
    ['Minigame payout is worth', '$'+fmt(bestValue())+' per good run']
  ]);

  const note=el('div','hint');
  note.innerHTML='True odds fold every luck source together, so they tell you how unlikely '
    +'something really was rather than what is printed on it. The Index sandbox shows the same '
    +'figure for any combination you tick.';
  root.appendChild(note);
}

/* ---------- HELP ---------- */
function renderHelp(root){
  const sec=(h,p)=>{ const d=el('div','hsec'); d.innerHTML='<h3>'+h+'</h3>'+p; root.appendChild(d); };
  sec('The idea',
    '<p>The machine at the top drops difficulties onto the ground. Click one to collect it and '
    +'get paid. Rarer difficulties are worth far more, so everything you buy is about tilting the '
    +'odds further in your favour.</p>'
    +'<p>Click and drag across the ground to sweep up lots at once, or use <b>Collect All</b>.</p>');
  sec('Luck',
    '<p>Every difficulty has odds written as 1 in N. Luck multiplies your chance at all of them at '
    +'once, so at 50x luck a 1 in 1,000 difficulty turns up roughly 1 in 20 times.</p>'
    +'<p>Fortune and the dropper models raise it, Prism core multiplies whatever you already have, '
    +'and Overcharge gives you a short burst of it on demand.</p>');
  sec('Modifiers',
    '<p>Any modifier can land on any difficulty, and they all stack. Sizes multiply together, so '
    +'Large Mini comes out roughly normal while Colossal Gargantuan is enormous. When two or more '
    +'colour modifiers land at once they blend into a gradient across the block.</p>'
    +'<p>A modifier multiplies the odds, so a Golden Insane is 1,000 times rarer than a plain one, '
    +'and worth much more.</p>');
  sec('Diamonds',
    '<p>Around one collect in fifty also pays diamonds, and the payout is the square root of the '
    +'rarity. A 1 in 1,000,000 block pays about a thousand diamonds, a common one pays one, so '
    +'diamonds come from finding rare things rather than from grinding.</p>'
    +'<p>Spend them in the <b>Super</b> shop on upgrades that multiply everything else.</p>');
  sec('The announcements',
    '<p>The banner at the top only fires when a drop was genuinely rare <i>for you</i>. It works '
    +'out the real odds of that exact difficulty with that exact set of modifiers, counting your '
    +'luck, modifier luck, overcharge and the mini dropper. A 1 in 1,000,000 block pulled at 1,000x '
    +'luck was really 1 in 1,000, so it stays quiet. You can raise the bar in Settings.</p>');
  sec('Minigames',
    '<p>Five of them, under <b>Games</b>. What they pay scales with the rarest thing you have ever '
    +'collected, so they are worth more the further in you are. Leave 90 seconds between runs of '
    +'the same one for the full payout.</p>'
    +'<p>Sweeper and Merge use the mouse. Flappy uses <span class="hkey">space</span> or a click. '
    +'Stack and Snake use the <span class="hkey">arrow keys</span>.</p>');
  sec('Credits',
    '<p>Inspired by <b>E_E-12345</b> on Scratch. '
    +'<a href="https://scratch.mit.edu/projects/864016756" target="_blank" rel="noopener" '
    +'style="color:#8ff04a">Play the original project</a>.</p>'
    +'<p>Globe icons show what everyone playing has collected between them. '
    +(gMode==='local'
      ? 'This copy has no shared counter connected, so those numbers are just yours for now.'
      : 'Those numbers are shared.')+'</p>');
}

/* ---------- BOOT ---------- */
function paintDropper(){ dropperEl.innerHTML=dropperSVG(S.up.dropper);
  if(DROP_W) dropperEl.querySelector('svg').setAttribute('width',DROP_W); }
async function boot(){
  applySave(await Store.load());
  primeSfx();
  paintDropper(); buildCA(); measure(); paintMini(); loadTrack(S.track,false); updateHUD();
  dropX=W*0.5; dropFrom=dropX; dropTo=dropX; newCycle();
  window.addEventListener('resize',measure);
  setInterval(()=>Store.save(snapshot()),10000);
  GNet.read().then(live=>{
    G=mergeG({total:0,diff:{},mod:{},combo:{},rarest:null},live);
    paintGlobalBest();
  });
  /* Cloudflare's free tier allows 1,000 saves a day across everyone playing, so this
   sends updates every three minutes rather than every thirty seconds. */
  setInterval(gFlush,180000);
  window.addEventListener('pagehide',()=>{ gFlush(); });
  $('#logo').src=LOGO_SRC;
  $('#scratchLogo').src=SCRATCH_SRC;
  paintMute();
  tryStartMusic();          /* if the browser allows it, music is already going */
  last=performance.now(); requestAnimationFrame(frame);
  runCutscene();
}
boot().catch(e=>{
  console.error('Difficulty Collector failed to start:',e);
  showTitle();
});
</script>
